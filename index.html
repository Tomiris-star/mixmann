<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mixmann</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .ios-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="h-16 border-b border-gray-800 flex items-center justify-between px-4 bg-[#0b0f19]/80 backdrop-blur">
        <h1 class="text-lg font-bold tracking-tight">Mixmann</h1>
        <div class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-full border border-emerald-500/20">
            🟢 Алихан
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div class="ios-card p-4">
                <p class="text-[10px] text-gray-400 uppercase">Прибыль</p>
                <p class="text-lg font-bold text-emerald-400">540к ₸</p>
            </div>
            <div class="ios-card p-4">
                <p class="text-[10px] text-gray-400 uppercase">Склад</p>
                <p class="text-lg font-bold text-white">2.1М ₸</p>
            </div>
        </div>

        <!-- Блок поиска и фильтров -->
        <div class="ios-card p-3">
            <input type="text" placeholder="🔍 Найти товар или сырье..." class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500">
        </div>
        <div class="ios-card p-4">
            <button class="w-full bg-emerald-600 text-white font-medium py-3 rounded-xl text-sm mb-2 shadow-lg shadow-emerald-900/20">
                📦 Оформить отгрузку
            </button>
            <div class="grid grid-cols-2 gap-2">
                <button class="bg-white/10 text-white py-2 rounded-xl text-xs">📥 Приход</button>
                <button class="bg-white/10 text-white py-2 rounded-xl text-xs">⚖️ Рецепты</button>
            </div>
        </div>

        <div class="ios-card p-4">
            <h3 class="text-sm font-semibold text-gray-300 mb-3">Критическое сырье</h3>
            <div class="space-y-3 text-xs">
                <div class="flex justify-between">
                    <span class="text-gray-400">Цемент М500</span>
                    <span class="text-red-400 font-bold">200 кг</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Песок 0-5</span>
                    <span class="text-amber-400 font-bold">500 кг</span>
                </div>
            </div>
        </div>
    </main>

    <nav class="h-16 border-t border-gray-800 bg-[#121826] flex justify-around items-center text-[10px] text-gray-400">
        <div class="text-emerald-400 flex flex-col items-center"><span>📊</span><span>Главная</span></div>
        <div class="flex flex-col items-center"><span>📦</span><span>Склад</span></div>
        <div class="flex flex-col items-center"><span>📑</span><span>Заказы</span></div>
        <div class="flex flex-col items-center"><span>⚙️</span><span>Настройки</span></div>
    </nav>

</body>
</html>
